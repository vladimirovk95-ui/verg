<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VERG.exe</title>

<style>

body {
    background:#050505;
    color:#ddd;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

#game {
    width:90%;
    max-width:600px;
    text-align:center;
}

h1 {
    color:white;
    letter-spacing:5px;
}

#text {
    min-height:150px;
    line-height:1.6;
    font-size:20px;
}

button {

background:#111;
color:white;
border:1px solid #777;
padding:15px 30px;
margin:10px;
font-size:18px;

}

#reader {

margin:20px auto;

}

</style>

</head>


<body>


<div id="game">

<h1>VERG.exe</h1>

<div id="text"></div>


<button id="next">
Продолжить
</button>


<button id="scan">
Сканировать Аркану
</button>


<div id="reader"></div>


</div>



<script src="https://unpkg.com/html5-qrcode"></script>


<script>


const text=document.getElementById("text");
const next=document.getElementById("next");
const scan=document.getElementById("scan");


let stage=0;


const params =
new URLSearchParams(window.location.search);


if(params.get("start")==="fool"){

stage=1;

}



const scenes=[

`
...

Соединение установлено.

...
`,

`
Карта обнаружена.

АРКАН 0

ШУТ
`,

`
Интересно...

Именно с этой карты
начинаются все путешествия.
`,

`
Я — Вердж.

Цифровое отражение
твоего проводника.

Сегодня тебе предстоит
пройти путь.
`,

`
Она ждёт тебя.

Начинаем спуск.
`

];



function show(){

text.innerHTML=scenes[stage];

}



next.onclick=function(){

stage++;


if(stage>=scenes.length){

stage=scenes.length-1;

}


show();

};



scan.onclick=function(){


const scanner =
new Html5Qrcode("reader");


scanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:250
},


(decodedText)=>{


scanner.stop();


window.location.href=decodedText;


},


(error)=>{


}

);


};



show();


</script>


</body>

</html>
