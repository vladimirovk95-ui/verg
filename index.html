<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VERG.exe</title>

<style>

body {
background:#050505;
color:#ddd;
font-family:Georgia, serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

#game {
width:90%;
max-width:600px;
text-align:center;
}

h1 {
color:white;
letter-spacing:5px;
}

#text {
min-height:150px;
line-height:1.6;
font-size:20px;
}

button {
background:#111;
color:white;
border:1px solid #777;
padding:15px 30px;
margin:10px;
font-size:18px;
}

#reader {
margin:20px auto;
}

</style>

</head>

<body>

<div id="game">

<h1>VERG.exe</h1>

<div id="text">
Ожидание Аркана...
</div>

<button id="scan">
Сканировать Аркану
</button>

<button id="deck">
Мои Арканы
</button>

<div id="inventory"></div>

<div id="reader"></div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

const text=document.getElementById("text");
const scan=document.getElementById("scan");
const deck=document.getElementById("deck");
const inventoryBox=document.getElementById("inventory");

let inventory =
JSON.parse(localStorage.getItem("verg_cards")) || [];

const cards={

"01-05":{

name:"V — Иерофант",

text:`

Аркан распознан.

V — Иерофант.

Первый фрагмент пути найден.

Но имя хранителя
ещё скрыто.

`

},

"01-04":{

name:"IV — Император",

text:`

Аркан распознан.

Император.

Часть силы хранителя получена.

`

},

"02-08":{

name:"VIII — Сила",

text:`

Аркан распознан.

Сила.

Следующий круг открыт.

`

},

"fool":{

name:"0 — Шут",

text:`

...

Соединение установлено.

Карта обнаружена.

АРКАН 0

ШУТ.

Путешествие начинается.

`

}

};

function addCard(id){

if(!inventory.includes(id)){

inventory.push(id);

localStorage.setItem(
"verg_cards",
JSON.stringify(inventory)
);

}

}

function startCard(id){

if(cards[id]){

addCard(id);

text.innerHTML =
cards[id].text;

}

else{

text.innerHTML=
`
Карта не распознана.

Вердж ожидает Аркан.
`;

}

}

const params =
new URLSearchParams(window.location.search);

const keeper=params.get("k");
const arcana=params.get("a");

if(keeper && arcana){

startCard(
keeper+"-"+arcana
);

}

scan.onclick=function(){

const scanner =
new Html5Qrcode("reader");

scanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:250
},

(decodedText)=>{

scanner.stop();

window.location.href =
decodedText + "&v=" + Date.now();

},

(error)=>{}

);

};

deck.onclick=function(){

if(inventory.length===0){

inventoryBox.innerHTML=
"Колода пуста";

return;

}

inventoryBox.innerHTML=

"<h2>Твои Арканы</h2>"

+

inventory.map(id=>{

return "<p>"+cards[id].name+"</p>";

}).join("");

};

</script>

</body>

</html>
