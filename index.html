<script>

if(card){

);

const cards={

"01-05":{

text:`

"01-04":{

function startCard(id){

if(cards[id]){

function show(){

text.innerHTML=scenes[stage];

}



next.onclick=function(){

stage++;


if(stage>=scenes.length){

stage=scenes.length-1;

}


show();

};



scan.onclick=function(){


const scanner =
new Html5Qrcode("reader");


scanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:250
},


(decodedText)=>{


scanner.stop();



window.location.href =
decodedText + "?v=" + Date.now();
